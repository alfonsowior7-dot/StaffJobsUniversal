# STAFFJOBS Universal 1.0.2
settings:
  notifications:
    sound: BLOCK_NOTE_BLOCK_PLING
  staff:
    afk-minutes: 5
  backups:
    enabled: true
    interval-hours: 24
    keep: 7
  update-check:
    enabled: true
    repository: https://raw.githubusercontent.com/alfonsowior7-dot/StaffJobsUniversal/main/src/main/resources/plugin.yml
  max-death-logs: 100
  max-reports: 100
  auto-save: true
  freeze:
    prevent-movement: true
    prevent-interaction: true
    prevent-attack: true
  rollback:
    restore-armor: true
    restore-offhand: true
    replace-inventory: true
  reports:
    cooldown-seconds: 60
    max-history: 500
    allow-empty-message: false
    notify-staff: true
    expiration-hours: 0
  timezone: Asia/Jakarta
  activity-logs:
    max-entries: 500
  death-notifications:
    enabled: true
    permission: staffjobs.deathnotify

  punishments:
    max-history-per-player: 100
    mute-message: "You are muted and cannot chat."
