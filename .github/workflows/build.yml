name: Build STAFFJOBS Universal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build universal plugin
        run: gradle clean build
      - name: Verify release JAR and plugin version
        shell: bash
        run: |
          JAR="build/libs/StaffJobsUniversal-1.0.0.jar"
          test -f "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Fx "version: 1.0.0"
          echo "Verified release file: $JAR"
      - name: Upload STAFFJOBS Universal 1.0.0
        uses: actions/upload-artifact@v4
        with:
          name: StaffJobsUniversal-1.0.0
          path: build/libs/StaffJobsUniversal-1.0.0.jar
          if-no-files-found: error
